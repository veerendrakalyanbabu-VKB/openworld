services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openworld
      POSTGRES_PASSWORD: openworld
      POSTGRES_DB: openworld
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openworld"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - OPENWORLD_DEMO_MODE=true
      - OPENWORLD_DATABASE_URL=postgresql://openworld:openworld@postgres:5432/openworld
      - OPENWORLD_SECRET_KEY=dev-only-not-for-production-use-32b-minimum-key
      - OPENWORLD_CORS_ORIGINS=["http://localhost:3000"]
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
